<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curvy: Glute Scan &amp; Workout</title>
<meta name="description" content="Curvy scans your glutes, builds a training plan around your weakest zone and tracks your progress. For iPhone.">
<link rel="icon" href="assets/favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
  :root {
    --ink: #1b1419;
    --muted: #6b5f68;
    --accent: #7a2f63;
    --rule: #ece4ea;
    --bg: #ffffff;
    --card: #faf6f9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f4eff3;
      --muted: #b3a6b0;
      --accent: #e6789c;
      --rule: #342a31;
      --bg: #161214;
      --card: #201a1e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 64px 20px 64px;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 620px; margin: 0 auto; text-align: center; }
  .icon { width: 112px; height: 112px; border-radius: 25px; display: block; margin: 0 auto 22px; }
  h1 { font-size: 34px; line-height: 1.2; margin: 0 0 8px; letter-spacing: -0.02em; }
  .tagline { color: var(--muted); font-size: 18px; margin: 0 auto 32px; max-width: 480px; }
  .links {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 6px 0;
    margin: 0 auto;
    max-width: 420px;
    text-align: left;
  }
  .links a {
    display: block;
    padding: 14px 20px;
    color: var(--ink);
    text-decoration: none;
    font-weight: 600;
  }
  .links a + a { border-top: 1px solid var(--rule); }
  .links a span { float: right; color: var(--accent); }
  footer { color: var(--muted); font-size: 15px; margin-top: 40px; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img class="icon" src="assets/icon-256.png" alt="Curvy app icon">
  <h1>Curvy</h1>
  <p class="tagline">Scan your glutes, train your weakest zone, and watch your progress. For iPhone.</p>

  <nav class="links">
    <a href="privacy.html">Privacy Policy <span>›</span></a>
    <a href="terms.html">Terms of Use <span>›</span></a>
    <a href="support.html">Support <span>›</span></a>
  </nav>

  <footer>
    <p>Curvy · operated by Oskar Bruce, United Kingdom · <a href="mailto:oskar@curvy-app.com">oskar@curvy-app.com</a></p>
  </footer>
</main>
</body>
</html>
